# Nginx reverse proxy configuration.
#
# In this project Nginx sits in front of the stack as the single
# externally-facing service. It doesn't proxy to a web app (the monitor
# is a background loop, not an HTTP server) -- instead it serves as a
# documented, working reverse-proxy + security-header baseline that
# would front a real app in a production deployment. The `/health`
# location is a static, always-200 endpoint used by deploy.sh's
# post-deploy health check.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Basic request logging.
    log_format main '$remote_addr - $time_local "$request" $status '
                     '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Don't leak the nginx version in headers/error pages.
    server_tokens off;

    upstream app_upstream {
        # Placeholder upstream. Swap this for a real app service
        # (e.g. "app:8000") if/when the monitor exposes an HTTP API.
        server 127.0.0.1:65535 max_fails=0;
    }

    server {
        listen 80;
        server_name _;

        # --- Security headers ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        # Only send HSTS over an actual TLS listener; harmless here since
        # this server block is plain HTTP, kept for documentation purposes.
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            default_type text/plain;
            return 200 "Linux Server Deployment & Monitoring Toolkit - nginx reverse proxy is up.\nSee /health for the health-check endpoint used by scripts/deploy.sh.\n";
        }
    }
}
