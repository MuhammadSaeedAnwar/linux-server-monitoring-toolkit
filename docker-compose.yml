services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    # Fixed image name so scripts/deploy.sh can tag/roll back the image no
    # matter which folder the repo was cloned into.
    image: linux-toolkit-app:latest
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Path inside the container; the host file is mounted there below.
      TOOLKIT_CONFIG_PATH: /app/config/config.yaml
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: linux-toolkit-nginx:latest
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    depends_on:
      - app

volumes:
  pgdata:
