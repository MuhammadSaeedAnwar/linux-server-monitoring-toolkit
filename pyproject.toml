[project]
name = "linux-server-toolkit"
version = "0.1.0"
description = "Linux server deployment and monitoring toolkit (system health, network diagnostics, service checks) backed by PostgreSQL."
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "psycopg2-binary>=2.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.11",
]

[project.scripts]
toolkit = "monitoring.cli:main"

[tool.setuptools.packages.find]
include = ["monitoring*"]
